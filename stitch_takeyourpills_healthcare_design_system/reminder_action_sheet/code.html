<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TakeYourPills - Reminder</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-container": "#506765",
                      "tertiary-container": "#6f7675",
                      "surface-container-high": "#e2e8f8",
                      "on-primary-fixed-variant": "#1f4e4b",
                      "secondary-fixed": "#cfe8e5",
                      "on-tertiary": "#ffffff",
                      "error": "#ba1a1a",
                      "on-secondary": "#ffffff",
                      "surface-container-low": "#f0f3ff",
                      "on-surface": "#151c27",
                      "on-error": "#ffffff",
                      "on-tertiary-fixed": "#161d1d",
                      "surface-container-highest": "#dce2f3",
                      "surface-variant": "#dce2f3",
                      "on-tertiary-fixed-variant": "#414848",
                      "outline": "#707977",
                      "surface": "#f9f9ff",
                      "on-secondary-fixed": "#081f1e",
                      "surface-bright": "#f9f9ff",
                      "primary-fixed-dim": "#a0d0cb",
                      "inverse-primary": "#a0d0cb",
                      "tertiary-fixed-dim": "#c1c8c7",
                      "inverse-surface": "#2a313d",
                      "secondary": "#4c6361",
                      "on-surface-variant": "#404847",
                      "background": "#f9f9ff",
                      "surface-dim": "#d3daea",
                      "secondary-fixed-dim": "#b3cbc9",
                      "outline-variant": "#c0c8c6",
                      "on-secondary-fixed-variant": "#344b49",
                      "on-background": "#151c27",
                      "on-primary": "#ffffff",
                      "on-primary-container": "#f3fffd",
                      "error-container": "#ffdad6",
                      "on-primary-fixed": "#00201e",
                      "on-error-container": "#93000a",
                      "secondary-container": "#cce5e2",
                      "primary": "#366460",
                      "primary-fixed": "#bbece7",
                      "primary-container": "#4f7d79",
                      "surface-tint": "#386663",
                      "surface-container": "#e7eefe",
                      "on-tertiary-container": "#f7fefd",
                      "inverse-on-surface": "#ebf1ff",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed": "#dde4e3",
                      "tertiary": "#565d5d"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "md": "16px",
                      "xl": "32px",
                      "unit": "4px",
                      "lg": "24px",
                      "gutter": "16px",
                      "xs": "4px",
                      "container-padding": "20px",
                      "sm": "8px"
              },
              "fontFamily": {
                      "display-lg": ["Manrope"],
                      "label-caps": ["Manrope"],
                      "headline-md": ["Manrope"],
                      "title-sm": ["Manrope"],
                      "body-sm": ["Manrope"],
                      "body-base": ["Manrope"]
              },
              "fontSize": {
                      "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                      "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                      "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                      "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                      "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen relative overflow-hidden">
<!-- Mock Background Content (Dashboard) to give context to the overlay -->
<div class="p-container-padding max-w-[600px] mx-auto opacity-40 blur-sm pointer-events-none select-none">
<div class="h-16 flex items-center justify-between mb-8">
<div class="w-10 h-10 rounded-full bg-surface-container-high"></div>
<div class="w-24 h-6 rounded-md bg-surface-container-high"></div>
<div class="w-10 h-10 rounded-full bg-surface-container-high"></div>
</div>
<div class="w-48 h-10 rounded-lg bg-surface-container-high mb-6"></div>
<div class="w-full h-32 rounded-2xl bg-surface-container-high mb-4"></div>
<div class="w-full h-24 rounded-2xl bg-surface-container-high mb-4"></div>
<div class="w-full h-24 rounded-2xl bg-surface-container-high"></div>
</div>
<!-- Overlay Background -->
<div class="fixed inset-0 bg-on-surface/30 z-40 flex flex-col justify-end items-center sm:px-4 sm:pb-4 transition-opacity duration-300">
<!-- Bottom Sheet Container -->
<div class="w-full max-w-[600px] bg-surface rounded-t-[28px] sm:rounded-[28px] shadow-[0px_-8px_30px_rgba(0,0,0,0.08)] flex flex-col relative z-50 transform translate-y-0 transition-transform duration-300 ease-out">
<!-- Drag Handle Affordance -->
<div class="w-full pt-4 pb-2 flex justify-center items-center">
<div class="w-12 h-1.5 rounded-full bg-outline-variant/50"></div>
</div>
<!-- Sheet Content -->
<div class="px-container-padding pb-8 pt-2 flex flex-col">
<!-- Header / Context -->
<div class="flex flex-col items-center text-center mb-8">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container mb-4 shadow-sm">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">medication</span>
</div>
<span class="text-label-caps font-label-caps text-primary uppercase mb-1">Due Now</span>
<h2 class="text-headline-md font-headline-md text-on-surface mb-1">Lexapro 10mg</h2>
<p class="text-body-base font-body-base text-on-surface-variant">Take 1 pill with food</p>
</div>
<!-- Action List -->
<div class="flex flex-col gap-3">
<!-- Primary Action: Take Now -->
<button class="w-full min-h-[64px] bg-primary hover:bg-surface-tint text-on-primary rounded-2xl px-5 py-4 flex items-center justify-center gap-3 shadow-[0px_4px_20px_rgba(54,100,96,0.2)] transition-colors duration-200">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-title-sm font-title-sm">Take now</span>
</button>
<!-- Secondary Action: Snooze (Tonal) -->
<button class="w-full min-h-[72px] bg-surface-container hover:bg-surface-container-high text-on-surface rounded-2xl px-5 py-4 flex items-center gap-4 transition-colors duration-200">
<div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-secondary">snooze</span>
</div>
<div class="flex flex-col text-left">
<span class="text-title-sm font-title-sm text-on-surface">Snooze</span>
<span class="text-body-sm font-body-sm text-on-surface-variant">Remind me in 30 minutes</span>
</div>
</button>
<!-- Tertiary Action: Skip (Ghost/Outline) -->
<button class="w-full min-h-[72px] bg-surface text-on-surface border border-outline-variant hover:bg-surface-dim/30 rounded-2xl px-5 py-4 flex items-center gap-4 transition-colors duration-200">
<div class="w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary">next_plan</span>
</div>
<div class="flex flex-col text-left">
<span class="text-title-sm font-title-sm text-on-surface">Skip</span>
<span class="text-body-sm font-body-sm text-tertiary">I don't need this dose</span>
</div>
</button>
</div>
<!-- Quiet Text Action: Missed -->
<div class="mt-6 flex justify-center">
<button class="text-body-base font-body-base text-tertiary hover:text-on-surface-variant transition-colors py-2 px-4 rounded-lg">
                        Mark as missed
                    </button>
</div>
</div>
</div>
</div>
</body></html>
