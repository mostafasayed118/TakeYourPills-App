<div class="flex justify-between items-center mb-md">
<h2 class="font-title-sm text-title-sm text-on-background">October 2023</h2>
<div class="flex gap-sm">
<button class="h-[44px] w-[44px] flex items-center justify-center rounded-full bg-surface-container-lowest shadow-[0px_4px_20px_rgba(0,0,0,0.04)] text-on-surface">

</button>
<button class="h-[44px] w-[44px] flex items-center justify-center rounded-full bg-surface-container-lowest shadow-[0px_4px_20px_rgba(0,0,0,0.04)] text-on-surface">

</button>
</div>
</div>

<span class="font-body-base text-body-base">26</span>

</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">light_mode</span>
</div>
<h3 class="font-title-sm text-title-sm text-on-background">Morning <span class="text-on-surface-variant font-body-sm text-body-sm ml-sm font-normal">8:00 AM</span></h3>
</div>

<div class="h-[44px] w-[44px] rounded-lg bg-surface-container flex items-center justify-center text-primary shrink-0">

</div>

</div>
</div>
</div>
</section>

<div class="flex items-center gap-md mb-md">
