org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter migrator flags (plugins app_settings / flutter_timezone still apply KGP)
android.builtInKotlin=false
android.newDsl=false

# Windows: project on E: + Pub cache on C: break Kotlin incremental caches
# ("this and base files have different roots"). Also set user env PUB_CACHE=E:\pub-cache
# (see scripts/run_android.ps1) so packages live on the same drive as the project.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.caching.enabled=false

# Reduce parallel pressure on Windows / secondary drives
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx2G
